# Actions Runner Controller (chart gha-runner-scale-set-controller 0.15.1,
# namespace arc-systems). Resources come from cluster.yaml
# (arc.resources.controller). One replica: the controller is a singleton.
replicaCount: 1

serviceAccount:
  create: true
  # Referenced by values/arc-runners.yaml (controllerServiceAccount).
  name: arc-controller

flags:
  logLevel: info
  logFormat: json

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
