# trust-manager v0.26.0 (chart jetstack/trust-manager v0.26.0): fixed settings.
# Copies the internal CA certificate (Bundle conservices-internal-ca) into
# every namespace labelled app.kubernetes.io/part-of=conservices. Replicas
# and resources come from cluster.yaml (trustManager.*).

podDisruptionBudget:
  enabled: true
  minAvailable: 1

app:
  trust:
    # Where Bundle sources (the CA Secret) are read from.
    namespace: cert-manager
