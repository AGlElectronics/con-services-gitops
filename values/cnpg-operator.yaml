# CloudNativePG operator 1.30.1 (chart cloudnative-pg 0.29.1): fixed
# settings. Replicas and resources come from cluster.yaml (cnpg.operator.*);
# with two replicas, leader election lets the second take over in seconds.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: cloudnative-pg
