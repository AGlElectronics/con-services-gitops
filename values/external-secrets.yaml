# External Secrets Operator 2.14.0 (chart external-secrets/external-secrets
# 2.14.0): fixed settings. Replicas and resources come from cluster.yaml
# (externalSecrets.*).

installCRDs: true

# Required with more than one controller replica.
leaderElect: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ClusterSecretStore/openbao logs in to OpenBao as this service account
# (OpenBao role "external-secrets" is bound to it).
serviceAccount:
  create: true
  name: external-secrets

webhook:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

certController:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
