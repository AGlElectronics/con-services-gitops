# Renders the whole template with examples/cluster.example-filled.yaml and
# validates the result. Runs on every push and pull request; also useful in
# your private copy (it then checks the template code, not your cluster.yaml,
# unless you change VALUES_FILE).
name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.0
  KUBECTL_VERSION: v1.36.1
  KUBECONFORM_VERSION: v0.8.0
  SHELLCHECK_VERSION: v0.11.0
  KUBERNETES_VERSION: 1.37.0
  VALUES_FILE: examples/cluster.example-filled.yaml
  # Branch or tag of AGlElectronics/con-services whose charts are rendered.
  # Every app has its own chart tag (<app>/v<version>); main holds the
  # newest chart of each.
  CHARTS_REF: main

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: gitops

      - uses: actions/checkout@v5
        with:
          repository: AGlElectronics/con-services
          ref: ${{ env.CHARTS_REF }}
          path: con-services
          sparse-checkout: deploy/charts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" --strip-components=1 linux-amd64/helm
          curl -fsSL -o "$HOME/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kubectl"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$HOME/bin" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          pip install pyyaml==6.0.3

      - name: No installation data, no latest tags
        working-directory: gitops
        run: python ci/no-installation-data.py .

      - name: Shell scripts
        working-directory: gitops
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck -x --source-path=SCRIPTDIR "${scripts[@]}"

      - name: Lint charts
        working-directory: gitops
        run: |
          set -euo pipefail
          helm lint charts/root -f "$VALUES_FILE"
          for c in charts/*/; do
            [[ "$c" == charts/root/ ]] || helm lint "$c"
          done

      - name: Root chart rejects an incomplete cluster.yaml
        working-directory: gitops
        run: |
          if helm template root charts/root -f cluster.yaml >/dev/null 2>err.txt; then
            echo "the blank cluster.yaml rendered without error"; exit 1
          fi
          grep -q "cluster.yaml is not complete" err.txt

      - name: Render every Application source
        working-directory: gitops
        run: python ci/render.py --values "$VALUES_FILE" --main-repo ../con-services --out build/rendered

      - name: Resources, image tags, modules wait for Den
        working-directory: gitops
        run: python ci/check.py build/rendered --sizing

      - name: Den only (no module enabled)
        working-directory: gitops
        run: |
          set -euo pipefail
          python ci/render.py --values "$VALUES_FILE" --values ci/no-modules.yaml \
            --main-repo ../con-services --out build/rendered-no-modules
          python ci/check.py build/rendered-no-modules

      - name: Without the OpenBao setup Job
        working-directory: gitops
        run: |
          set -euo pipefail
          python ci/render.py --values "$VALUES_FILE" --values ci/openbao-setup-off.yaml \
            --main-repo ../con-services --out build/rendered-setup-off
          python ci/check.py build/rendered-setup-off
          if ls build/rendered-setup-off/openbao-setup--*.yaml >/dev/null 2>&1; then
            echo "openbao-setup rendered although openbao.setup.enabled is false"; exit 1
          fi

      - name: Small profile (1 or 2 nodes)
        working-directory: gitops
        run: |
          set -euo pipefail
          python ci/render.py --values "$VALUES_FILE" --values ci/small-profile.yaml \
            --main-repo ../con-services --out build/rendered-small
          python ci/check.py build/rendered-small --sizing
          python ci/cases.py small build/rendered-small

      - name: Custom host names and root Application name
        working-directory: gitops
        run: |
          set -euo pipefail
          python ci/render.py --values "$VALUES_FILE" --values ci/custom-hosts.yaml \
            --main-repo ../con-services --out build/rendered-hosts
          python ci/check.py build/rendered-hosts
          python ci/cases.py hosts build/rendered-hosts

      - name: Root chart rejects bad settings (version mismatch, hosts)
        working-directory: gitops
        run: python ci/cases.py failures

      - name: PowerShell script parses
        working-directory: gitops
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/bootstrap/install-root.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

      - name: Schemas (kubeconform, strict)
        working-directory: gitops
        run: |
          set -euo pipefail
          python ci/crd-schemas.py build/rendered build/schemas
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern 'seed-plan\.json$' \
            -schema-location default \
            -schema-location 'build/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            build/rendered
