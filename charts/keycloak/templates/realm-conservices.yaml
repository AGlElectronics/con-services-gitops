{{- /*
GENERATED by bootstrap/scripts/keycloak-realm.py from the main repository's
infra/keycloak/realm-conservices.json. Re-run the script instead of editing by hand.
Imported once, when the realm does not exist yet. ${...} placeholders are
filled from the Secret keycloak-realm-secrets (external-secrets.yaml).
Docs: https://aglelectronics.github.io/con-services/deploy/identity/
Running realm (audience mappers, full group paths): docs/realm-mappers.md
*/ -}}
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: conservices
  namespace: conservices-identity
spec:
  keycloakCRName: keycloak
  placeholders:
    {{- include "keycloak.placeholders" (dict "root" . "clients" (dict "DEN_KEYCLOAK_CLIENT_SECRET" "den-keycloak" "HR_PROVISIONER_CLIENT_SECRET" "hr-provisioner" "LEARN_PROVISIONER_CLIENT_SECRET" "learn-provisioner")) | nindent 4 }}
  realm:
    {{- include "keycloak.smtpServer" (dict "root" . "displayName" "Con Services") | nindent 4 }}
    realm: conservices
    enabled: true
    displayName: Con Services
    registrationAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    loginTheme: conservices
    emailTheme: conservices
    components:
      org.keycloak.userprofile.UserProfileProvider:
      - providerId: declarative-user-profile
        subComponents: {}
        config:
          kc.user.profile.config:
          - '{"attributes":[{"name":"username","displayName":"${username}","validations":{"length":{"min":3,"max":255},"username-prohibited-characters":{},"up-username-not-idn-homograph":{}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"email","displayName":"${email}","validations":{"email":{},"length":{"max":255}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"firstName","displayName":"${firstName}","validations":{"length":{"max":255},"person-name-prohibited-characters":{}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"lastName","displayName":"${lastName}","validations":{"length":{"max":255},"person-name-prohibited-characters":{}},"required":{"roles":["user"]},"permissions":{"view":["admin","user"],"edit":["admin","user"]},"multivalued":false},{"name":"nickname","displayName":"Nickname","group":"hr","validations":{"length":{"max":255}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"phone","displayName":"Phone","group":"hr","validations":{"length":{"max":64}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"orgEmail","displayName":"Organisation email","group":"hr","validations":{"length":{"max":255}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"privateEmail","displayName":"Private email","group":"hr","validations":{"length":{"max":255}},"permissions":{"view":["admin","user"],"edit":["admin"]},"multivalued":false},{"name":"hrPersonId","displayName":"HR person id","group":"hr","permissions":{"view":["admin"],"edit":["admin"]},"multivalued":false}],"groups":[{"name":"user-metadata","displayHeader":"User metadata","displayDescription":"Attributes, which refer to user metadata"},{"name":"hr","displayHeader":"Managed by HR","displayDescription":"Kept in sync by the HR module; edit these in HR."}]}'
    editUsernameAllowed: true
    sslRequired: all
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 36000
    ssoSessionMaxLifespan: 86400
    groups:
    - name: stash-admin
      path: /stash-admin
    - name: stash-readonly
      path: /stash-readonly
    - name: stash-dept-lead
      path: /stash-dept-lead
    - name: events-organizer
      path: /events-organizer
    - name: events-programme
      path: /events-programme
    - name: events-reviewer
      path: /events-reviewer
    - name: den-admin
      path: /den-admin
    - name: den-member
      path: /den-member
    - name: den-ops
      path: /den-ops
    - name: events-admin
      path: /events-admin
    - name: hr-admin
      path: /hr-admin
    - name: learn-admin
      path: /learn-admin
    - name: learn-trainer
      path: /learn-trainer
    - name: learn-coordinator
      path: /learn-coordinator
    - name: finance-admin
      path: /finance-admin
    - name: desk-admin
      path: /desk-admin
    - name: desk-agent
      path: /desk-agent
    - name: tasks-admin
      path: /tasks-admin
    - name: tasks-creator
      path: /tasks-creator
    - name: wiki-admin
      path: /wiki-admin
    - name: wiki-editor
      path: /wiki-editor
    users:
    - username: service-account-hr-provisioner
      enabled: true
      serviceAccountClientId: hr-provisioner
      clientRoles:
        realm-management:
        - manage-users
        - view-users
        - query-users
        - view-realm
        - query-groups
    - username: service-account-den-keycloak
      enabled: true
      serviceAccountClientId: den-keycloak
      clientRoles:
        realm-management: {{ ternary (list "manage-realm") (list) .Values.realm.denDisplayNameSync | toJson }}
    - username: service-account-learn-provisioner
      enabled: true
      serviceAccountClientId: learn-provisioner
      clientRoles:
        realm-management:
        - view-users
        - query-groups
    clients:
    - clientId: stash-spa
      name: Stash SPA
      enabled: true
      publicClient: true
      directAccessGrantsEnabled: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      protocol: openid-connect
      rootUrl: https://{{.Values.appHosts.stash}}.{{.Values.domain}}
      baseUrl: https://{{.Values.appHosts.stash}}.{{.Values.domain}}
      redirectUris:
      - https://{{.Values.appHosts.stash}}.{{.Values.domain}}/*
      webOrigins:
      - https://{{.Values.appHosts.stash}}.{{.Values.domain}}
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://{{.Values.appHosts.stash}}.{{.Values.domain}}/*
      protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          full.path: 'true'
          id.token.claim: 'true'
          access.token.claim: 'true'
          claim.name: groups
          userinfo.token.claim: 'true'
      - name: audience stash-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.custom.audience: stash-api
          id.token.claim: 'false'
          access.token.claim: 'true'
          introspection.token.claim: 'true'
    - clientId: den-spa
      name: Den SPA
      enabled: true
      publicClient: true
      directAccessGrantsEnabled: false
