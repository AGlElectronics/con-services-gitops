# Keycloak's secrets, read from OpenBao (ClusterSecretStore "openbao"). The
# random ones are created by External Secrets (charts/secret-store); SMTP is
# entered by you.
# Docs: https://aglelectronics.github.io/con-services/operations/secrets/
#
# keycloak-db: the "keycloak" PostgreSQL login. Same OpenBao entry as the
# role in charts/postgres, so both always agree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: conservices-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-db
    creationPolicy: Owner
    template:
      data:
        username: keycloak
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: conservices/postgres/roles/keycloak
        property: password
---
# Temporary admin of the master realm (username, password). Only read when
# Keycloak starts with an empty database. Delete the user in Keycloak after
# creating a real admin: deploy/identity.md#first-admin-login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: conservices-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    template:
      data:
        username: temp-admin
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: conservices/keycloak/bootstrap-admin
        property: password
---
# Values for the ${...} placeholders of the realm imports
# (realm-*.yaml): the secrets of the confidential clients and, with
# smtp.enabled, the SMTP login. The same OpenBao entries feed
# den-secrets, hr-secrets and learn-secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-realm-secrets
  namespace: conservices-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: keycloak-realm-secrets
    creationPolicy: Owner
  data:
    - secretKey: den-keycloak
      remoteRef:
        key: conservices/keycloak/clients
        property: den-keycloak
    - secretKey: hr-provisioner
      remoteRef:
        key: conservices/keycloak/clients
        property: hr-provisioner
    - secretKey: learn-provisioner
      remoteRef:
        key: conservices/keycloak/clients
        property: learn-provisioner
    {{- if .Values.smtp.enabled }}
    - secretKey: smtp-host
      remoteRef:
        key: conservices/keycloak/smtp
        property: host
    - secretKey: smtp-port
      remoteRef:
        key: conservices/keycloak/smtp
        property: port
    - secretKey: smtp-from
      remoteRef:
        key: conservices/keycloak/smtp
        property: from
    - secretKey: smtp-username
      remoteRef:
        key: conservices/keycloak/smtp
        property: username
    - secretKey: smtp-password
      remoteRef:
        key: conservices/keycloak/smtp
        property: password
    {{- end }}
