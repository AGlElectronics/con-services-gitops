# keycloak-public: Keycloak on port 443. Two users:
#   - the public Gateway (HTTPRoutes <host>.<domain>, <adminHost>.<domain>;
#     default auth and auth-admin);
#   - pods inside the cluster: CoreDNS rewrites <host>.<domain> to this
#     Service, so https://<host>.<domain>/realms/... works without leaving
#     the cluster (backends check tokens against that issuer).
# The selector matches the labels the Keycloak Operator puts on its pods.
apiVersion: v1
kind: Service
metadata:
  name: keycloak-public
  namespace: conservices-identity
  labels:
    app.kubernetes.io/name: keycloak
spec:
  selector:
    app: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/managed-by: keycloak-operator
  ports:
    - name: https
      port: 443
      targetPort: 8443
{{- if and .Values.podDisruptionBudget (gt (int .Values.instances) 1) }}
---
# Only with 2+ instances: with one, minAvailable 1 would block every node
# drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: conservices-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
      app.kubernetes.io/instance: keycloak
      app.kubernetes.io/managed-by: keycloak-operator
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: keycloak-public
  namespace: conservices-identity
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: keycloak-public
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: conservices-internal-ca
    hostname: keycloak-public.conservices-identity.svc.cluster.local
