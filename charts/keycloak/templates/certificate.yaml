# Keycloak's HTTPS certificate (internal CA). Names:
#   keycloak.conservices-identity.svc...         in-cluster admin API (HR, Learn, Den)
#   keycloak-public.conservices-identity.svc...  the Gateway (BackendTLSPolicy) and
#                                                pods resolving auth.<domain> via CoreDNS
#   <host>.<domain>, <adminHost>.<domain>        public names (CoreDNS rewrite, Gateway)
# Keycloak re-reads the files every hour, so renewals need no restart.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: conservices-identity
spec:
  secretName: keycloak-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: conservices-internal-ca
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  commonName: keycloak.conservices-identity.svc.cluster.local
  dnsNames:
    - keycloak
    - keycloak.conservices-identity
    - keycloak.conservices-identity.svc
    - keycloak.conservices-identity.svc.cluster.local
    - keycloak-public
    - keycloak-public.conservices-identity
    - keycloak-public.conservices-identity.svc
    - keycloak-public.conservices-identity.svc.cluster.local
    - {{ .Values.host }}.{{ .Values.domain }}
    - {{ .Values.adminHost }}.{{ .Values.domain }}
