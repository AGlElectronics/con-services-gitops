{{- /*
GENERATED by bootstrap/scripts/keycloak-realm.py from the main repository's
infra/keycloak/realm-attendees.json. Re-run the script instead of editing by hand.
Imported once, when the realm does not exist yet. ${...} placeholders are
filled from the Secret keycloak-realm-secrets (external-secrets.yaml).
Docs: https://aglelectronics.github.io/con-services/deploy/identity/
Running realm (audience mappers, full group paths): docs/realm-mappers.md
*/ -}}
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: attendees
  namespace: conservices-identity
spec:
  keycloakCRName: keycloak
  placeholders:
    {{- include "keycloak.placeholders" (dict "root" . "clients" (dict)) | nindent 4 }}
  realm:
    {{- include "keycloak.smtpServer" (dict "root" . "displayName" "Attendee login") | nindent 4 }}
    realm: attendees
    enabled: true
    displayName: Attendee login
    registrationAllowed: true
    registrationEmailAsUsername: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: true
    verifyEmail: true
    loginTheme: conservices
    emailTheme: conservices
    sslRequired: all
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 36000
    ssoSessionMaxLifespan: 86400
    clients:
    - clientId: rally-submit
      name: Event submissions (public site)
      enabled: true
      publicClient: true
      directAccessGrantsEnabled: false
      standardFlowEnabled: true
      implicitFlowEnabled: false
      protocol: openid-connect
      rootUrl: https://{{.Values.appHosts.submit}}.{{.Values.domain}}
      baseUrl: https://{{.Values.appHosts.submit}}.{{.Values.domain}}
      redirectUris:
      - https://{{.Values.appHosts.submit}}.{{.Values.domain}}/*
      webOrigins:
      - https://{{.Values.appHosts.submit}}.{{.Values.domain}}
      attributes:
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: https://{{.Values.appHosts.submit}}.{{.Values.domain}}/*
      protocolMappers:
      - name: audience events-public-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.custom.audience: events-public-api
          id.token.claim: 'false'
          access.token.claim: 'true'
          introspection.token.claim: 'true'
    bruteForceProtected: {{ .Values.realm.bruteForce.enabled }}
    permanentLockout: {{ .Values.realm.bruteForce.permanentLockout }}
    failureFactor: {{ .Values.realm.bruteForce.failureFactor }}
    waitIncrementSeconds: {{ .Values.realm.bruteForce.waitIncrementSeconds }}
    maxFailureWaitSeconds: {{ .Values.realm.bruteForce.maxFailureWaitSeconds }}
    maxDeltaTimeSeconds: {{ .Values.realm.bruteForce.maxDeltaTimeSeconds }}
    minimumQuickLoginWaitSeconds: {{ .Values.realm.bruteForce.minimumQuickLoginWaitSeconds }}
    quickLoginCheckMilliSeconds: {{ .Values.realm.bruteForce.quickLoginCheckMilliSeconds }}
    passwordPolicy: {{ include "keycloak.passwordPolicy" . | quote }}
