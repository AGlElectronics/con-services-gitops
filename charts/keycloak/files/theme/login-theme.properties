parent=keycloak.v2
import=common/keycloak

# js/brand.js fetches the brand from Den (GET <denPublicUrl>/api/v1/public/brand)
# in the browser; Den needs no access to the realm for it. Set DEN_PUBLIC_URL on
# Keycloak to Den's public address, e.g. https://den.example.org. Empty: the
# neutral look from css/conservices.css.
denPublicUrl=${env.DEN_PUBLIC_URL:}

styles=css/styles.css css/conservices.css
scripts=js/brand.js
