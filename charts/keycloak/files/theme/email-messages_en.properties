# Sent by HR "Complete onboarding" (execute-actions-email with UPDATE_PASSWORD).
# {0} link, {1} expiration (minutes), {2} realm name, {3} actions, {4} expiration (human)
executeActionsSubject=Your onboarding is complete - set your password
executeActionsBody=Welcome to {2}!\n\nYour onboarding has been completed and your account is ready. Before you can sign in, please create your password using the link below:\n\n{0}\n\nThis link expires in {4}. After setting your password you will be taken to the portal, where you can sign in from now on.\n\nIf you were not expecting this email, you can ignore it.
executeActionsBodyHtml=<p>Welcome to <strong>{2}</strong>!</p><p>Your onboarding has been completed and your account is ready. Before you can sign in, please create your password:</p><p><a href="{0}">Set my password</a></p><p>This link expires in {4}. After setting your password you will be taken to the portal, where you can sign in from now on.</p><p>If you were not expecting this email, you can ignore it.</p>
