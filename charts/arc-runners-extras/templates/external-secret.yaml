# The GitHub App ARC authenticates with, read from OpenBao
# (ClusterSecretStore "openbao", KV path kv/infra/github-arc). Write it with
# bootstrap/scripts/openbao-seed.sh.
# Docs: https://aglelectronics.github.io/con-services/operations/secrets/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: arc-github-app
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        key: infra/github-arc
        property: github_app_id
    - secretKey: github_app_installation_id
      remoteRef:
        key: infra/github-arc
        property: github_app_installation_id
    - secretKey: github_app_private_key
      remoteRef:
        key: infra/github-arc
        property: github_app_private_key
