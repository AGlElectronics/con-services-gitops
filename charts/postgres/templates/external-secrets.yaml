{{- /*
Kubernetes Secrets for the PostgreSQL logins, from OpenBao (ClusterSecretStore
"openbao", KV v2 at "kv"); written by bootstrap/scripts/openbao-seed.sh.
CloudNativePG needs type kubernetes.io/basic-auth with "username" equal to
the role name; cnpg.io/reload applies a changed password straight away.
*/ -}}
{{- define "postgres.loginSecret" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: conservices-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: {{ .name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ .username }}
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .key }}
        property: password
{{- end }}
{{- include "postgres.loginSecret" (dict "name" "conservices-pg-superuser" "username" "postgres" "key" "conservices/postgres/superuser") }}
{{- range .Values.roles }}
---
{{ include "postgres.loginSecret" (dict "name" (printf "conservices-pg-role-%s" .) "username" . "key" (printf "conservices/postgres/roles/%s" .)) }}
{{- end }}
---
# S3 key for the base backups and WAL archive. Its own key, so application
# keys cannot delete backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backups-s3
  namespace: conservices-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cnpg-backups-s3
    creationPolicy: Owner
    template:
      data:
        ACCESS_KEY_ID: "{{ "{{ .accessKey }}" }}"
        ACCESS_SECRET_KEY: "{{ "{{ .secretKey }}" }}"
        REGION: {{ .Values.backup.region | quote }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: conservices/postgres/backup-s3
        property: access_key
    - secretKey: secretKey
      remoteRef:
        key: conservices/postgres/backup-s3
        property: secret_key
