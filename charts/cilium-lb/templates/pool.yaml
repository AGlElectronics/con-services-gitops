# Addresses Cilium LB IPAM may give to Services of type LoadBalancer (the
# Gateways). Pick free addresses on the nodes' network that no DHCP server
# hands out.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: conservices
spec:
  blocks:
    {{- range .Values.blocks }}
    {{- if kindIs "string" . }}
    - cidr: {{ . }}
    {{- else }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
---
# Answer ARP requests for LoadBalancer IPs on the local network, so the
# router and clients reach the Gateways. One node at a time holds each IP
# (a Lease per Service) and another takes over if it fails.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: conservices
spec:
  {{- with .Values.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  loadBalancerIPs: true
  externalIPs: true
