# Defaults of the root chart. Do NOT edit this file in your copy: set your
# values in cluster.yaml at the root of the repository, which overrides
# anything here. Keys left at "change-me" make the chart stop with a message
# saying which value is missing.
# Reference: https://aglelectronics.github.io/con-services/deploy/argocd/#clusteryaml-reference

# --- Required ---------------------------------------------------------------

# Your domain. Apps live on <app>.<domain>, Rally on events.<domain>,
# Keycloak on auth.<domain> (admin console: auth-admin.<domain>), Argo CD
# on argocd.<domain> (internal Gateway).
domain: change-me

git:
  # HTTPS URL of YOUR copy of this repository, the one Argo CD reads.
  repoURL: change-me
  # Branch or tag of your copy that Argo CD follows.
  targetRevision: main

acme:
  # Let's Encrypt sends certificate expiry warnings here.
  email: change-me
  # ClusterIssuer of the wildcard certificate. Start with
  # letsencrypt-staging; switch to letsencrypt-prod once it works.
  issuer: letsencrypt-staging
  dns01:
    # cloudflare: DNS-01 through the Cloudflare API, token from OpenBao
    #             kv/infra/cloudflare (property api-token).
    # custom:     your own cert-manager solvers in acme.dns01.solvers (a list
    #             in cert-manager's ClusterIssuer format; you add any secret
    #             they need yourself).
    provider: cloudflare
    solvers: []

s3:
  # Managed S3-compatible object storage for files (Den, Stash, Rally,
  # Learn, Wiki, Tasks). HTTPS URL without bucket name.
  endpoint: change-me
  region: change-me
  # true: https://<endpoint>/<bucket> (path style). false: virtual-host
  # style https://<bucket>.<endpoint>.
  pathStyle: true
  # Buckets are <bucketPrefix>-conservices-<app>, <bucketPrefix>-pg-backups
  # and <bucketPrefix>-den-backups. Create them before the first sync.
  bucketPrefix: change-me
  # DNS names of the endpoint for the egress network policies (Cilium
  # toFQDNs). Add "*.<host>" for virtual-host style.
  fqdns:
    - change-me
  backup:
    # Where PostgreSQL and Den backups go. Empty: same as above. Another
    # region or provider is recommended.
    endpoint: ""
    region: ""
    # Empty: same as s3.pathStyle.
    pathStyle: null
    # DNS names of the backup endpoint when it differs from the one above.
    fqdns: []

den:
  # age PUBLIC key(s) Den encrypts its backups to, comma-separated
  # (age-keygen prints "Public key: age1..."). Not secret.
  backupAgeRecipients: change-me
  # Empty: images.tag.
  imageTag: ""
  # Extra values for the Den chart (deploy/charts/den), merged last.
  values: {}

# --- Images and charts ------------------------------------------------------

images:
  # Default tag of every Con Services image (MAJOR.MINOR.PATCH-BUILD).
  tag: "1.0.0-1"
  pullSecret:
    # true: every Con Services namespace gets the Secret ghcr-pull from
    # OpenBao kv/infra/ghcr (username, token) and uses it to pull images.
    # Only needed for private images.
    enabled: false

# Where the Den and module Helm charts come from.
charts:
  repoURL: https://github.com/AGlElectronics/con-services.git
  targetRevision: v1.1.0

# --- Modules ----------------------------------------------------------------
# Opt-in: no module is installed until you enable it in cluster.yaml. Den is
# always installed. Every enabled module is listed on Den's Modules page as
# unpaired and waits for Den (den.mode: required) until you pair it there.
# enabled:      install the module.
# imageTag:     empty = images.tag.
# accessConfig: the module's access configuration (TOML). Empty = the file
#               charts/module-extras/files/access-config/<module>.toml.
# values:       extra values for the module chart, merged last (replicas,
#               resources, config.* settings). den.mode cannot be changed.

modules:
  stash:   { enabled: false, imageTag: "", accessConfig: "", values: {} }
  hr:      { enabled: false, imageTag: "", values: {} }
  rally:
    enabled: false
    imageTag: ""
    accessConfig: ""
    # Public submission site on submit.<domain>. Needs an image.
    submit: { enabled: false }
    values: {}
  finance: { enabled: false, imageTag: "", values: {} }
  learn:   { enabled: false, imageTag: "", accessConfig: "", values: {} }
  wiki:    { enabled: false, imageTag: "", accessConfig: "", values: {} }
  desk:    { enabled: false, imageTag: "", accessConfig: "", values: {} }
  tasks:   { enabled: false, imageTag: "", accessConfig: "", values: {} }

# Sender address of Learn's mail. Empty: no-reply@<domain>.
smtp:
  from: ""

# --- Network ----------------------------------------------------------------

gateway:
  # GatewayClass of your Gateway API implementation.
  className: cilium
  public:
    # Fixed LoadBalancer IP (Cilium LB IPAM annotation). Empty: any.
    loadBalancerIP: ""
    # Extra annotations for the Gateway's Service (other load balancers).
    annotations: {}
  internal:
    loadBalancerIP: ""
    annotations: {}

loadBalancer:
  ciliumL2:
    # true: this template creates a Cilium LB IPAM pool and an L2
    # announcement policy. Needs Cilium with l2announcements.enabled and
    # both gateway.*.loadBalancerIP inside the pool.
    enabled: false
    # CIDRs (192.0.2.240/29) or ranges ({start: ..., stop: ...}).
    blocks: []
    # Node interfaces to announce on (regular expressions). Empty: all.
    interfaces: []

# How pods reach Keycloak on https://auth.<domain> without leaving the
# cluster (the issuer URL must be the public one).
#   coredns-custom: write the ConfigMap kube-system/coredns-custom, read
#                   by k3s and AKS CoreDNS.
#   none:           you add the rewrite to CoreDNS yourself.
oidcHairpin:
  mode: none

# Admin UIs on the internal Gateway.
adminRoutes:
  # Only if Longhorn is installed. Its UI has no login.
  longhorn: false
  # Only if Hubble UI is installed (namespace kube-system).
  hubble: false

# --- Storage ----------------------------------------------------------------

storage:
  # StorageClass for volumes that need replication by the storage layer.
  # Empty: the cluster default.
  className: ""
  longhornSingle:
    # true: create the StorageClass longhorn-single (one Longhorn replica,
    # data on the pod's node) and use it for PostgreSQL, which replicates
    # itself.
    enabled: false

# --- Cluster prerequisites --------------------------------------------------
# cert-manager, trust-manager, External Secrets Operator, OpenBao and the
# CloudNativePG operator are installed and run by the cluster operator, not
# by this template. These settings say where to find them.
# Reference: https://aglelectronics.github.io/con-services/deploy/prerequisites/

externalSecrets:
  # Namespace and service account of External Secrets Operator. The
  # ClusterSecretStore "openbao" logs in to OpenBao as this service account.
  namespace: external-secrets
  serviceAccount: external-secrets

openbao:
  # OpenBao's API as seen from External Secrets Operator. Use an address that
  # reaches only the unsealed leader (upstream chart: Service openbao-active).
  server: https://openbao-active.openbao.svc:8200
  # Mount path of the KV version 2 engine Con Services uses.
  kvPath: kv
  # The CA certificate that signed OpenBao's TLS certificate. Namespace
  # empty: externalSecrets.namespace. Name empty: no CA (OpenBao has a
  # publicly trusted certificate).
  caBundle:
    kind: ConfigMap
    name: openbao-ca
    key: ca.crt
    namespace: ""
  # Kubernetes auth method: mount path and role (created by
  # bootstrap/scripts/openbao-configure.sh).
  auth:
    mountPath: kubernetes
    role: external-secrets

# --- Platform components ----------------------------------------------------

postgres:
  instances: 3
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 1Gi } }
  # Namespace of the CloudNativePG operator (a prerequisite).
  operatorNamespace: cnpg-system
  storage:
    className: ""
    size: 20Gi
    walSize: 10Gi
  backup:
    # Base backup schedule (six fields, seconds first) and retention.
    schedule: "0 15 2 * * *"
    retention: 30d
    # The Barman Cloud sidecar in every PostgreSQL pod (WAL archiving).
    sidecarResources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }

keycloakOperator:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }

keycloak:
  instances: 2
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
  smtp:
    # true: the realms send mail (password reset, verification) through the
    # server in OpenBao kv/conservices/keycloak/smtp.
    enabled: true

argocd:
  # true: Argo CD manages its own installation from bootstrap/argocd/values.yaml.
  selfManage: true
  values: {}

# --- Self-hosted GitHub Actions runners (optional) --------------------------

arc:
  enabled: false
  # Organisation (or repository) the runners register with.
  githubConfigUrl: https://github.com/your-org
  runnerScaleSetName: arc-conservices
  minRunners: 0
  maxRunners: 3
  runnerImage: ghcr.io/aglelectronics/ci-runner:2.338.2-1
  buildkitImage: moby/buildkit:v0.34.2-rootless
  testDatabaseImage: postgres:16.15-alpine
  resources:
    controller: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
    listener: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 128Mi } }
    runner: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "2", memory: 6Gi } }
    buildkit: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "4", memory: 6Gi } }
    testDatabase: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
