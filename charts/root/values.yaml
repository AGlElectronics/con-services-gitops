# Defaults of the root chart. Do NOT edit this file in your copy: set your
# values in cluster.yaml at the root of the repository, which overrides
# anything here. Keys left at "change-me" make the chart stop with a message
# saying which value is missing.
# Reference: https://aglelectronics.github.io/con-services/deploy/argocd/#clusteryaml-reference

# --- Required ---------------------------------------------------------------

# Your domain. Every app lives on <host>.<domain>; the host labels are set
# per app below (den.host, modules.<name>.host, keycloak.host, ...).
# Defaults: den, stash, hr, events (Rally), submit (Rally's submission
# site), finance, learn, wiki, desk, tasks, auth (Keycloak) and auth-admin
# (Keycloak's admin console, internal Gateway).
domain: change-me

git:
  # HTTPS URL of YOUR copy of this repository, the one Argo CD reads.
  repoURL: change-me
  # Branch or tag of your copy that Argo CD follows.
  targetRevision: main

acme:
  # Let's Encrypt sends certificate expiry warnings here.
  email: change-me
  # ClusterIssuer of the wildcard certificate. Start with
  # letsencrypt-staging; switch to letsencrypt-prod once it works.
  issuer: letsencrypt-staging
  dns01:
    # cloudflare: DNS-01 through the Cloudflare API, token from OpenBao
    #             conservices/infra/cloudflare (property api-token).
    # custom:     your own cert-manager solvers in acme.dns01.solvers (a list
    #             in cert-manager's ClusterIssuer format; you add any secret
    #             they need yourself).
    provider: cloudflare
    solvers: []

s3:
  # Managed S3-compatible object storage for files (Den, Stash, Rally,
  # Finance, Learn, Wiki, Tasks). HTTPS URL without bucket name.
  endpoint: change-me
  region: change-me
  # true: https://<endpoint>/<bucket> (path style). false: virtual-host
  # style https://<bucket>.<endpoint>.
  pathStyle: true
  # Buckets are <bucketPrefix>-conservices-<app>, <bucketPrefix>-pg-backups
  # and <bucketPrefix>-den-backups. Create them before the first sync.
  bucketPrefix: change-me
  # DNS names of the endpoint for the egress network policies (Cilium
  # toFQDNs). Add "*.<host>" for virtual-host style.
  fqdns:
    - change-me
  backup:
    # Where PostgreSQL and Den backups go. Empty: same as above. Another
    # region or provider is recommended.
    endpoint: ""
    region: ""
    # Empty: same as s3.pathStyle.
    pathStyle: null
    # DNS names of the backup endpoint when it differs from the one above.
    fqdns: []

den:
  # age PUBLIC key(s) Den encrypts its backups to, comma-separated
  # (age-keygen prints "Public key: age1..."). Not secret.
  backupAgeRecipients: change-me
  # Den's release: image tag MAJOR.MINOR.PATCH-BUILD. Every module's MAJOR
  # must equal Den's MAJOR.
  version: "1.0.0-1"
  # Git revision of charts.repoURL with Den's chart. Empty: the tag
  # den/v<MAJOR.MINOR.PATCH> of version (den/v1.0.0).
  chartRevision: ""
  # Host label: Den on <host>.<domain>.
  host: den
  # Extra values for the Den chart (deploy/charts/den), merged last.
  values: {}

# --- Root Application -------------------------------------------------------

rootApplication:
  # Name of the Application bootstrap/install-root creates (the "app of
  # apps" that renders every other Application of this chart).
  name: conservices-stack

# --- Sizing profile ---------------------------------------------------------

# standard: highly available, needs 3 or more nodes (PostgreSQL 3
#           instances, Keycloak 2, PodDisruptionBudgets, spread over nodes).
# small:    for 1 or 2 nodes, NOT highly available: PostgreSQL 1 instance,
#           Keycloak 1, no PodDisruptionBudgets, nothing that refuses to
#           share a node. Keys you set yourself (postgres.instances,
#           keycloak.instances, den/modules values.ha.*) still win.
# Docs: https://aglelectronics.github.io/con-services/deploy/sizing/#small-profile
profile: standard

# --- Images and charts ------------------------------------------------------

images:
  pullSecret:
    # true: every Con Services namespace gets the Secret ghcr-pull from
    # OpenBao conservices/infra/ghcr (username, token) and uses it to pull images.
    # Only needed for private images.
    enabled: false

# Where the Den and module Helm charts come from. Each app's chart is read
# at its own revision (den.chartRevision, modules.<name>.chartRevision).
charts:
  repoURL: https://github.com/AGlElectronics/con-services.git

# --- Modules ----------------------------------------------------------------
# Opt-in: no module is installed until you enable it in cluster.yaml. Den is
# always installed. Every enabled module is listed on Den's Modules page as
# unpaired and waits for Den (den.mode: required) until you pair it there.
# enabled:       install the module.
# version:       the module's release, image tag MAJOR.MINOR.PATCH-BUILD.
#                Its MAJOR must equal Den's MAJOR (den.version).
# chartRevision: Git revision of charts.repoURL with the module's chart.
#                Empty: the tag <module>/v<MAJOR.MINOR.PATCH> of version.
# host:          host label: the module on <host>.<domain>. One DNS label
#                (no dots), unique across all apps.
# accessConfig:  the module's access configuration (TOML). Empty = the file
#                charts/module-extras/files/access-config/<module>.toml.
# values:        extra values for the module chart, merged last (replicas,
#                resources, config.* settings). den.mode cannot be changed.

modules:
  stash:   { enabled: false, version: "1.0.0-1", chartRevision: "", host: stash, accessConfig: "", values: {} }
  hr:      { enabled: false, version: "1.0.0-1", chartRevision: "", host: hr, values: {} }
  # Rally is not released with 1.0.0. rally/v1.0.0 is not a chart tag yet,
  # so a real cluster.yaml keeps enabled: false.
  rally:
    enabled: false
    version: "1.0.0-1"
    chartRevision: ""
    host: events
    accessConfig: ""
    # Public submission site on <submit.host>.<domain>. Needs an image.
    submit: { enabled: false, host: submit }
    values: {}
  finance: { enabled: false, version: "1.0.0-1", chartRevision: "", host: finance, values: {} }
  learn:   { enabled: false, version: "1.0.0-1", chartRevision: "", host: learn, accessConfig: "", values: {} }
  wiki:    { enabled: false, version: "1.0.0-1", chartRevision: "", host: wiki, accessConfig: "", values: {} }
  desk:    { enabled: false, version: "1.0.0-1", chartRevision: "", host: desk, accessConfig: "", values: {} }
  tasks:   { enabled: false, version: "1.0.0-1", chartRevision: "", host: tasks, accessConfig: "", values: {} }

# Sender address of Learn's mail. Empty: no-reply@<domain>.
smtp:
  from: ""

# --- Network ----------------------------------------------------------------

gateway:
  # GatewayClass of your Gateway API implementation.
  className: cilium
  public:
    # Fixed LoadBalancer IP, requested from Cilium LB IPAM with the
    # annotation lbipam.cilium.io/ips. Empty: any. The IP pool itself is
    # the cluster's. Recommended: pin both. Unpinned, Cilium may hand the
    # public and internal Gateways each other's address (for example after
    # they are recreated), and your port forward then points at the
    # internal Gateway.
    loadBalancerIP: ""
    # Extra annotations for the Gateway's Service (other load balancers).
    annotations: {}
  internal:
    loadBalancerIP: ""
    annotations: {}

# Admin UIs on the internal Gateway.
adminRoutes:
  # Only if Longhorn is installed. Its UI has no login.
  longhorn: false
  # Only if Hubble UI is installed (namespace kube-system).
  hubble: false

# --- Storage ----------------------------------------------------------------

storage:
  # StorageClass for volumes that need replication by the storage layer.
  # Empty: the cluster default.
  className: ""
  longhornSingle:
    # true: create the StorageClass longhorn-single (one Longhorn replica,
    # data on the pod's node) and use it for PostgreSQL, which replicates
    # itself.
    enabled: false

# --- Cluster prerequisites --------------------------------------------------
# cert-manager, trust-manager, External Secrets Operator, OpenBao, the
# CloudNativePG operator and Argo CD are installed and run by the cluster
# operator, not by this template. These settings say where to find them.
# Reference: https://aglelectronics.github.io/con-services/deploy/prerequisites/

externalSecrets:
  # Namespace and service account of External Secrets Operator. The
  # ClusterSecretStore "openbao" logs in to OpenBao as this service account.
  namespace: external-secrets
  serviceAccount: external-secrets

openbao:
  # OpenBao's API as seen from External Secrets Operator. Use an address that
  # reaches only the unsealed leader (upstream chart: Service openbao-active).
  server: https://openbao-active.openbao.svc:8200
  # Mount path of the KV version 2 engine Con Services uses: its own mount
  # at the root of OpenBao, next to any other mounts. Inside it, "modules/"
  # holds Den's and the modules' entries and "infra/" the shared ones
  # (PostgreSQL, Keycloak, Cloudflare, ghcr).
  kvPath: conservices
  # The CA certificate that signed OpenBao's TLS certificate. Namespace
  # empty: externalSecrets.namespace. Name empty: no CA (OpenBao has a
  # publicly trusted certificate).
  caBundle:
    kind: ConfigMap
    name: openbao-ca
    key: ca.crt
    namespace: ""
  # Kubernetes auth method: mount path, and the role External Secrets
  # Operator logs in with (policy conservices-external-secrets).
  auth:
    mountPath: kubernetes
    role: external-secrets
  # Namespace of the OpenBao pods. The setup Job may only connect there
  # (NetworkPolicy). Empty: no NetworkPolicy for the Job.
  namespace: openbao
  # The Application "openbao-setup" (manual sync): a Job that enables the
  # KV engine at kvPath and writes the role auth.role for External Secrets.
  # It logs in as its own service account with setup.role, which the
  # OpenBao administrator creates once (bootstrap/scripts/openbao-configure.sh).
  # Argo CD stops at this Application until you review it and press Sync.
  # false: you do both yourself; see deploy/secrets-openbao in the docs.
  setup:
    enabled: true
    role: conservices-setup
    serviceAccount: conservices-openbao-setup
    image: quay.io/openbao/openbao:2.7.2

# --- Platform components ----------------------------------------------------

postgres:
  # Empty: 3 with profile standard, 1 with profile small.
  instances: null
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 1Gi } }
  # Namespace of the CloudNativePG operator (a prerequisite).
  operatorNamespace: cnpg-system
  storage:
    className: ""
    size: 20Gi
    walSize: 10Gi
  backup:
    # Base backup schedule (six fields, seconds first) and retention.
    schedule: "0 15 2 * * *"
    retention: 30d
    # The Barman Cloud sidecar in every PostgreSQL pod (WAL archiving).
    sidecarResources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }

keycloakOperator:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }

keycloak:
  # Host labels: sign-in on <host>.<domain>, admin console on
  # <adminHost>.<domain> (internal Gateway only).
  host: auth
  adminHost: auth-admin
  # Empty: 2 with profile standard, 1 with profile small.
  instances: null
  resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "2", memory: 2Gi } }
  smtp:
    # true: the realms send mail (password reset, verification) through the
    # server in OpenBao conservices/infra/keycloak/smtp.
    enabled: true
  # Sign-in protection of both realms (staff "conservices" and "attendees").
  # Used when a realm is first imported only: on a running realm change these
  # in Keycloak's admin console (docs: deploy/identity, "Changing a running
  # realm").
  realm:
    bruteForce:
      # Temporary lockout after failureFactor failed sign-ins within
      # maxDeltaTimeSeconds; the wait grows by waitIncrementSeconds per
      # failure, up to maxFailureWaitSeconds.
      enabled: true
      permanentLockout: false
      failureFactor: 10
      waitIncrementSeconds: 60
      maxFailureWaitSeconds: 900
      maxDeltaTimeSeconds: 43200
      minimumQuickLoginWaitSeconds: 60
      quickLoginCheckMilliSeconds: 1000
    passwordPolicy:
      # At least minLength characters (8 or more), not the username, not the
      # e-mail address.
      minLength: 12
      notUsername: true
      notEmail: true
      # More Keycloak policies joined with " and ", e.g. "passwordHistory(3)".
      extra: ""
    # true: Den's client den-keycloak may write the realm (realm-management
    # manage-realm, Keycloak has nothing smaller) so Den keeps the realm
    # display name equal to the organisation name. false: no
    # realm-management role at all; set the display name yourself.
    denDisplayNameSync: true
