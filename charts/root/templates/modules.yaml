{{- /*
The modules, sync wave 5: the last wave, shared with Den. Argo CD waits for
each wave to be Healthy before it applies the next one, but not for the
last: Den and the modules are applied together and the root sync ends, so a
Degraded module or Den never blocks the sync that delivers its fix. The
modules wait for Den at runtime (den.mode: required) instead.
One Application per enabled module: the chart from the main repository at
the module's own release, plus charts/module-extras (ExternalSecrets,
access configuration).
*/ -}}
{{- $v := .Values }}
{{- $meta := include "root.moduleMeta" . | fromYaml }}
{{- range $n := fromJsonArray (include "root.enabledModules" $) }}
{{- $m := index $v.modules $n }}
{{- $mm := index $meta $n }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $n }}
  namespace: argocd
  labels:
    conservices.io/module: {{ $n }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ $v.charts.repoURL }}
      targetRevision: {{ include "root.chartRevision" (dict "app" $n "version" $m.version "chartRevision" $m.chartRevision) }}
      path: deploy/charts/{{ $n }}
      helm:
        releaseName: {{ $n }}
        valuesObject:
          {{- toYaml (mergeOverwrite (include "root.moduleValues" (dict "root" $ "name" $n) | fromYaml) $m.values) | nindent 10 }}
    {{- include "root.repoSourceItem" (dict "root" $ "path" "charts/module-extras") | nindent 4 }}
      helm:
        valuesObject:
          {{- include "root.extrasValues" (dict "root" $ "name" $n) | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-{{ $n }}
  {{- include "root.syncPolicy" (dict "options" (list "CreateNamespace=true" "ServerSideApply=true") "labels" (include "root.nsLabels" (dict "tier" "module" "module" $mm.label) | fromYaml)) | nindent 2 }}
{{- end }}
