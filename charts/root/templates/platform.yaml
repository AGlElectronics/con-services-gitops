{{- /*
The platform, sync waves 0 to 5: namespaces, CloudNativePG, Keycloak, Den.
*/ -}}
{{- $v := .Values }}
{{- $meta := include "root.moduleMeta" . | fromYaml }}
{{- $enabled := fromJsonArray (include "root.enabledModules" .) }}
---
# Namespaces cnpg-system, conservices-data, conservices-identity with their
# labels, default-deny and DNS policies. No finalizer: deleting this
# Application must never delete the namespaces (and the database in them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "components/platform-namespaces") | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# CloudNativePG operator 1.30.1 with its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg-operator
        valueFiles:
          - $values/values/cnpg-operator.yaml
        {{- $op := dict "replicaCount" $v.cnpg.operator.replicas "resources" $v.cnpg.operator.resources }}
        valuesObject:
          {{- toYaml (mergeOverwrite $op $v.cnpg.operator.values) | nindent 10 }}
    {{- include "root.valuesRef" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Barman Cloud plugin: WAL archiving and base backups of PostgreSQL to S3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        releaseName: cnpg-barman-cloud
        valueFiles:
          - $values/values/cnpg-barman-cloud.yaml
        {{- $bc := dict "replicaCount" $v.cnpg.barmanCloud.replicas "resources" $v.cnpg.barmanCloud.resources }}
        valuesObject:
          {{- toYaml (mergeOverwrite $bc $v.cnpg.barmanCloud.values) | nindent 10 }}
    {{- include "root.valuesRef" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Keycloak Operator 26.8.2 (CRDs, RBAC, Deployment) in conservices-identity.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "components/keycloak-operator") | nindent 4 }}
    kustomize:
      patches:
        - target:
            kind: Deployment
            name: keycloak-operator
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/resources
              value: {{ toJson $v.keycloakOperator.resources }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-identity
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# PostgreSQL cluster conservices-pg: roles, databases, backups. No
# finalizer: deleting this Application must never delete the database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "charts/postgres") | nindent 4 }}
    helm:
      {{- $s3 := include "root.s3" . | fromYaml }}
      {{- $p := $v.postgres }}
      {{- $roles := list "den" "keycloak" }}
      {{- range $n := $enabled }}{{ $roles = append $roles (index $meta $n).role }}{{ end }}
      {{- $pg := dict
            "instances" $p.instances
            "resources" $p.resources
            "storage" (dict
              "className" (include "root.selfReplicatingClass" (dict "root" $ "override" $p.storage.className))
              "size" $p.storage.size
              "walSize" $p.storage.walSize)
            "roles" $roles
            "backup" (dict
              "endpoint" $s3.backupEndpoint
              "region" $s3.backupRegion
              "bucket" (printf "%s-pg-backups" $s3.prefix)
              "fqdns" $s3.backupFqdns
              "schedule" $p.backup.schedule
              "retention" $p.backup.retention
              "sidecarResources" $v.cnpg.barmanCloud.sidecarResources) }}
      valuesObject:
        {{- toYaml $pg | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-data
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Keycloak: auth.<domain>, admin console auth-admin.<domain> (internal),
# realms conservices (staff) and attendees.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "charts/keycloak") | nindent 4 }}
    helm:
      valuesObject:
        domain: {{ $v.domain }}
        instances: {{ $v.keycloak.instances }}
        resources: {{ toJson $v.keycloak.resources }}
        smtp: {{ toJson $v.keycloak.smtp }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-identity
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Den, the portal: backend, web app and operator (backups).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: den
  namespace: argocd
  labels:
    conservices.io/module: den
    {{- if $v.images.pullSecret.enabled }}
    conservices.io/image-pull-secret: ghcr-pull
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ $v.charts.repoURL }}
      targetRevision: {{ $v.charts.targetRevision }}
      path: deploy/charts/den
      helm:
        releaseName: den
        valuesObject:
          {{- toYaml (mergeOverwrite (include "root.denValues" . | fromYaml) $v.den.values) | nindent 10 }}
    {{- include "root.repoSourceItem" (dict "root" $ "path" "charts/module-extras") | nindent 4 }}
      helm:
        valuesObject:
          {{- include "root.extrasValues" (dict "root" $ "name" "den") | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-den
  {{- include "root.syncPolicy" (dict "options" (list "CreateNamespace=true" "ServerSideApply=true") "labels" (include "root.nsLabels" (dict "tier" "platform" "module" "den") | fromYaml)) | nindent 2 }}
