{{- /*
The platform, sync waves 0 to 4: namespaces, Keycloak, PostgreSQL. Den is
in the last wave (5) together with the modules, see modules.yaml.
The CloudNativePG operator and its Barman Cloud plugin are cluster
prerequisites.
*/ -}}
{{- $v := .Values }}
{{- $meta := include "root.moduleMeta" . | fromYaml }}
{{- $enabled := fromJsonArray (include "root.enabledModules" .) }}
{{- $profile := include "root.profile" . | fromJson }}
---
# Namespaces conservices-data and conservices-identity with their labels,
# default-deny and DNS policies. No finalizer: deleting this
# Application must never delete the namespaces (and the database in them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "components/platform-namespaces") | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Keycloak Operator 26.8.2 (CRDs, RBAC, Deployment) in conservices-identity,
# with its own network policies (API server egress): it must be Healthy
# before Keycloak (wave 4) is applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "components/keycloak-operator") | nindent 4 }}
    kustomize:
      patches:
        - target:
            kind: Deployment
            name: keycloak-operator
          patch: |-
            - op: add
              path: /spec/template/spec/containers/0/resources
              value: {{ toJson $v.keycloakOperator.resources }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-identity
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# PostgreSQL cluster conservices-pg: roles, databases, backups. No
# finalizer: deleting this Application must never delete the database.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "charts/postgres") | nindent 4 }}
    helm:
      {{- $s3 := include "root.s3" . | fromYaml }}
      {{- $p := $v.postgres }}
      {{- $roles := list "den" "keycloak" }}
      {{- range $n := $enabled }}{{ $roles = append $roles (index $meta $n).role }}{{ end }}
      {{- $pg := dict
            "instances" ($profile.postgresInstances | int)
            "podAntiAffinityType" (ternary "required" "preferred" $profile.strictSpread)
            "podDisruptionBudget" (not $profile.small)
            "resources" $p.resources
            "storage" (dict
              "className" (include "root.selfReplicatingClass" (dict "root" $ "override" $p.storage.className))
              "size" $p.storage.size
              "walSize" $p.storage.walSize)
            "roles" $roles
            "operatorNamespace" $p.operatorNamespace
            "backup" (dict
              "endpoint" $s3.backupEndpoint
              "region" $s3.backupRegion
              "bucket" (printf "%s-pg-backups" $s3.prefix)
              "fqdns" $s3.backupFqdns
              "schedule" $p.backup.schedule
              "retention" $p.backup.retention
              "sidecarResources" $p.backup.sidecarResources) }}
      valuesObject:
        {{- toYaml $pg | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-data
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Keycloak: <keycloak.host>.<domain>, admin console
# <keycloak.adminHost>.<domain> (internal), realms conservices (staff) and
# attendees.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    {{- include "root.repoSource" (dict "root" $ "path" "charts/keycloak") | nindent 4 }}
    helm:
      valuesObject:
        domain: {{ $v.domain }}
        host: {{ $v.keycloak.host }}
        adminHost: {{ $v.keycloak.adminHost }}
        # Host labels of the apps, by realm client prefix (Rally: events).
        appHosts:
          den: {{ $v.den.host }}
          {{- range $n := splitList " " (include "root.moduleNames" .) }}
          {{ (index $meta $n).label }}: {{ (index $v.modules $n).host }}
          {{- end }}
          submit: {{ $v.modules.rally.submit.host }}
        instances: {{ $profile.keycloakInstances | int }}
        strictSpread: {{ $profile.strictSpread }}
        podDisruptionBudget: {{ not $profile.small }}
        resources: {{ toJson $v.keycloak.resources }}
        smtp: {{ toJson $v.keycloak.smtp }}
        realm: {{ toJson $v.keycloak.realm }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-identity
  {{- include "root.syncPolicy" (dict "options" (list "ServerSideApply=true")) | nindent 2 }}
---
# Den, the portal: backend, web app and operator (backups). The last wave,
# shared with the modules: Argo CD does not wait for the health of the last
# wave, so a Degraded Den or module never holds back the sync that delivers
# its fix. The modules wait for Den at runtime (den.mode: required).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: den
  namespace: argocd
  labels:
    conservices.io/module: den
    {{- if $v.images.pullSecret.enabled }}
    conservices.io/image-pull-secret: ghcr-pull
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ $v.charts.repoURL }}
      targetRevision: {{ include "root.chartRevision" (dict "app" "den" "version" $v.den.version "chartRevision" $v.den.chartRevision) }}
      path: deploy/charts/den
      helm:
        releaseName: den
        valuesObject:
          {{- toYaml (mergeOverwrite (include "root.denValues" . | fromYaml) $v.den.values) | nindent 10 }}
    {{- include "root.repoSourceItem" (dict "root" $ "path" "charts/module-extras") | nindent 4 }}
      helm:
        valuesObject:
          {{- include "root.extrasValues" (dict "root" $ "name" "den") | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: conservices-den
  {{- include "root.syncPolicy" (dict "options" (list "CreateNamespace=true" "ServerSideApply=true") "labels" (include "root.nsLabels" (dict "tier" "platform" "module" "den") | fromYaml)) | nindent 2 }}
