{{- /*
Stops rendering with a readable message while cluster.yaml is incomplete.
Renders nothing.
*/ -}}
{{- $v := .Values }}

{{- $required := dict
  "domain" $v.domain
  "git.repoURL" $v.git.repoURL
  "acme.email" $v.acme.email
  "s3.endpoint" $v.s3.endpoint
  "s3.region" $v.s3.region
  "s3.bucketPrefix" $v.s3.bucketPrefix
  "den.backupAgeRecipients" $v.den.backupAgeRecipients
}}
{{- $missing := list }}
{{- range $key := keys $required | sortAlpha }}
{{- $val := index $required $key | toString }}
{{- if or (eq $val "") (contains "change-me" $val) }}{{ $missing = append $missing $key }}{{ end }}
{{- end }}
{{- if or (empty $v.s3.fqdns) (has "change-me" $v.s3.fqdns) }}{{ $missing = append $missing "s3.fqdns" }}{{ end }}
{{- if $missing }}
{{- fail (printf "\n\ncluster.yaml is not complete. Set these values (they are still \"change-me\" or empty):\n  - %s\n\nRun `grep -n change-me cluster.yaml` to find them. Reference: https://aglelectronics.github.io/con-services/deploy/argocd/#clusteryaml-reference\n" (join "\n  - " $missing)) }}
{{- end }}

{{- if not (hasPrefix "age1" $v.den.backupAgeRecipients) }}
{{- fail "\n\ncluster.yaml: den.backupAgeRecipients must be an age public key starting with \"age1\" (from `age-keygen`). Several keys: separate them with commas.\n" }}
{{- end }}
{{- if not (hasPrefix "https://" $v.s3.endpoint) }}
{{- fail (printf "\n\ncluster.yaml: s3.endpoint must start with https:// (got %q).\n" $v.s3.endpoint) }}
{{- end }}
{{- if and $v.s3.backup.endpoint (not (hasPrefix "https://" $v.s3.backup.endpoint)) }}
{{- fail (printf "\n\ncluster.yaml: s3.backup.endpoint must start with https:// (got %q).\n" $v.s3.backup.endpoint) }}
{{- end }}
{{- if and $v.s3.backup.endpoint (ne $v.s3.backup.endpoint $v.s3.endpoint) (empty $v.s3.backup.fqdns) }}
{{- fail "\n\ncluster.yaml: s3.backup.endpoint differs from s3.endpoint, so set s3.backup.fqdns to its DNS name(s); otherwise the network policies block the backups.\n" }}
{{- end }}

{{- if and (eq $v.acme.dns01.provider "custom") (empty $v.acme.dns01.solvers) }}
{{- fail "\n\ncluster.yaml: acme.dns01.provider is \"custom\", so set acme.dns01.solvers (cert-manager ClusterIssuer solvers).\n" }}
{{- end }}

{{- range $n, $m := $v.modules }}
{{- $mode := ((($m.values | default dict).den | default dict).mode | default "required") }}
{{- if ne (toString $mode) "required" }}
{{- fail (printf "\n\ncluster.yaml: modules.%s.values.den.mode cannot be changed. Every module in this template waits for Den until you pair it from Den's Modules page.\n" $n) }}
{{- end }}
{{- end }}

{{- /* Versions: MAJOR.MINOR.PATCH-BUILD, and every enabled module on Den's MAJOR. */ -}}
{{- $versionRe := "^[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$" }}
{{- if not (regexMatch $versionRe (toString $v.den.version)) }}
{{- fail (printf "\n\ncluster.yaml: den.version must be MAJOR.MINOR.PATCH-BUILD, for example 1.0.0-1 (got %q; there is no latest).\n" (toString $v.den.version)) }}
{{- end }}
{{- $denMajor := index (splitList "." $v.den.version) 0 }}
{{- range $n := fromJsonArray (include "root.enabledModules" .) }}
{{- $ver := toString (index $v.modules $n).version }}
{{- if not (regexMatch $versionRe $ver) }}
{{- fail (printf "\n\ncluster.yaml: modules.%s.version must be MAJOR.MINOR.PATCH-BUILD, for example 1.0.0-1 (got %q; there is no latest).\n" $n $ver) }}
{{- end }}
{{- if ne (index (splitList "." $ver) 0) $denMajor }}
{{- fail (printf "\n\ncluster.yaml: %s %s needs Den %s.x, but den.version is %s. A module's MAJOR must equal Den's MAJOR: change modules.%s.version or den.version.\n" $n (include "root.semver" $ver) (index (splitList "." $ver) 0) (include "root.semver" $v.den.version) $n) }}
{{- end }}
{{- end }}

{{- /* Host labels: one DNS label each (the wildcard certificate covers one level), unique. */ -}}
{{- $seen := dict }}
{{- range $h := fromJsonArray (include "root.hostsInUse" .) }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" (toString $h.host)) }}
{{- fail (printf "\n\ncluster.yaml: %s must be one lowercase DNS label without dots, for example \"portal\" for portal.%s (got %q). The wildcard certificate *.%s covers exactly one level.\n" $h.key $v.domain (toString $h.host) $v.domain) }}
{{- end }}
{{- if hasKey $seen $h.host }}
{{- fail (printf "\n\ncluster.yaml: %s and %s both use the host %s.%s. Every app needs its own host label.\n" (get $seen $h.host) $h.key $h.host $v.domain) }}
{{- end }}
{{- $_ := set $seen $h.host $h.key }}
{{- end }}

{{- /* The root Application's name must not clash with an Application it renders. */ -}}
{{- if has $v.rootApplication.name (splitList " " (include "root.childNames" .)) }}
{{- fail (printf "\n\ncluster.yaml: rootApplication.name %q is the name of one of the Applications the root chart renders. Pick another name (default: conservices-stack).\n" $v.rootApplication.name) }}
{{- end }}
