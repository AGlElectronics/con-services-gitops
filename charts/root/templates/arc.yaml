{{- /*
Optional self-hosted GitHub Actions runners (Actions Runner Controller).
Waves 20 and 21: after the modules, so a missing GitHub App never blocks the
platform. Guide: https://aglelectronics.github.io/con-services/deploy/self-hosted-runners/
*/ -}}
{{- $a := .Values.arc }}
{{- if $a.enabled }}
---
# The ARC charts are OCI artifacts; Argo CD needs the registry declared as
# an OCI Helm repository. Public charts: no credentials.
apiVersion: v1
kind: Secret
metadata:
  name: repo-arc-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "19"
stringData:
  name: actions-runner-controller-charts
  type: helm
  url: ghcr.io/actions/actions-runner-controller-charts
  enableOCI: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set-controller
      targetRevision: 0.15.1
      helm:
        releaseName: arc
        valueFiles:
          - $values/values/arc-controller.yaml
        valuesObject:
          resources: {{ toJson $a.resources.controller }}
    {{- include "root.valuesRef" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  {{- include "root.syncPolicy" (dict "options" (list "CreateNamespace=true" "ServerSideApply=true") "labels" (dict "pod-security.kubernetes.io/enforce" "restricted")) | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  labels:
    conservices.io/github-arc: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: 0.15.1
      helm:
        releaseName: {{ $a.runnerScaleSetName }}
        valueFiles:
          - $values/values/arc-runners.yaml
        valuesObject:
          {{- include "root.arcRunnerValues" . | nindent 10 }}
    {{- include "root.valuesRef" . | nindent 4 }}
    {{- include "root.repoSourceItem" (dict "root" $ "path" "charts/arc-runners-extras") | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  {{- /*
  The rootless BuildKit sidecar needs seccomp and AppArmor "Unconfined"
  (user namespaces), which only the privileged level admits. No container
  is privileged; warn and audit flag anything beyond baseline.
  */}}
  {{- include "root.syncPolicy" (dict "options" (list "CreateNamespace=true" "ServerSideApply=true" "SkipDryRunOnMissingResource=true") "labels" (dict "pod-security.kubernetes.io/enforce" "privileged" "pod-security.kubernetes.io/warn" "baseline" "pod-security.kubernetes.io/audit" "baseline")) | nindent 2 }}
{{- end }}
