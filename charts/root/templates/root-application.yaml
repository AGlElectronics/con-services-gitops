{{- /*
The root Application itself (rootApplication.name, default
conservices-stack). bootstrap/install-root renders this one file from
cluster.yaml and applies it; from then on it manages itself and every other
Application of this chart.
The finalizer makes `kubectl delete application <name>` delete the child
Applications too. The infrastructure Applications, platform-namespaces and
postgres have no finalizer, so their workloads and data (PostgreSQL) keep
running.
*/ -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.rootApplication.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: {{ .Values.git.repoURL }}
      targetRevision: {{ .Values.git.targetRevision }}
      path: charts/root
      helm:
        releaseName: root
        valueFiles:
          - $values/cluster.yaml
    {{- include "root.valuesRef" . | nindent 4 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  {{- include "root.syncPolicy" (dict) | nindent 2 }}
