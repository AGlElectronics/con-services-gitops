{{- /*
Admin UIs on the INTERNAL Gateway only. These names must resolve to the
internal Gateway IP on your network (split DNS, local DNS records or a hosts
file); see deploy/dns-and-certificates. Keycloak's admin route comes from
charts/keycloak.
*/ -}}
{{- $d := .Values.domain }}
{{- if .Values.adminRoutes.longhorn }}
# Longhorn's UI has NO login: anyone who reaches it can delete volumes.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: internal
      namespace: conservices-gateway
      sectionName: https
  hostnames:
    - longhorn.{{ $d }}
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
      # HSTS: browsers use only HTTPS for this host (TLS ends at the Gateway).
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
{{- end }}
{{- if .Values.adminRoutes.hubble }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: internal
      namespace: conservices-gateway
      sectionName: https
  hostnames:
    - hubble.{{ $d }}
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
      # HSTS: browsers use only HTTPS for this host (TLS ends at the Gateway).
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
{{- end }}
