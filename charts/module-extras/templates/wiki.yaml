{{- if eq .Values.app "wiki" }}
# Secrets of Wiki in conservices-wiki, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wiki-secrets
  namespace: conservices-wiki
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: wiki-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://wiki:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/wiki?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        # Encrypts the Den credential the module stores (shared denlink).
        DEN_LINK_ENCRYPTION_KEY: "{{`{{ .denLinkKey }}`}}"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
        WIKI_SERVICE_TOKEN: "{{`{{ .wikiToken }}`}}"
        {{- if has "hr" .Values.enabledModules }}
        # Same value as hr-secrets. HR reads this catalog; Wiki calls HR's directory.
        HR_SERVICE_TOKEN: "{{`{{ .hrServiceToken }}`}}"
        HR_DIRECTORY_TOKEN: "{{`{{ .hrDirectoryToken }}`}}"
        {{- end }}
  data:
    - secretKey: denLinkKey
      remoteRef:
        key: modules/wiki/den-link
        property: key
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/wiki
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: modules/wiki/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: modules/wiki/s3
        property: secret_key
    - secretKey: wikiToken
      remoteRef:
        key: modules/wiki/service-token
        property: token
    {{- if has "hr" .Values.enabledModules }}
    - secretKey: hrServiceToken
      remoteRef:
        key: modules/hr/service-token
        property: hr_service_token
    - secretKey: hrDirectoryToken
      remoteRef:
        key: modules/hr/directory-token
        property: hr_directory_token
    {{- end }}
{{- end }}
