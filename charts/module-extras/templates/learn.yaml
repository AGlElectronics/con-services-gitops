{{- if eq .Values.app "learn" }}
# Secrets of Learn in conservices-learn, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
#
# TELEGRAM_BOT_TOKEN is optional (remoteRef optional): a missing OpenBao
# entry becomes empty and Telegram stays off. SMTP_PASSWORD is not included.
# HR_SERVICE_TOKEN is included when HR is enabled: the same generated value
# as hr-secrets, so HR can read Learn's role catalog.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: learn-secrets
  namespace: conservices-learn
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: learn-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://learn:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/learn?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        # Encrypts the Den credential the module stores (shared denlink).
        DEN_LINK_ENCRYPTION_KEY: "{{`{{ .denLinkKey }}`}}"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
        KEYCLOAK_CLIENT_SECRET: "{{`{{ .keycloakClientSecret }}`}}"
        LEARN_SERVICE_TOKEN: "{{`{{ .learnToken }}`}}"
        # Anonymous-feedback dedupe hash.
        LEARN_FEEDBACK_PEPPER: "{{`{{ .feedbackPepper }}`}}"
        # Empty when the OpenBao entry does not exist yet.
        TELEGRAM_BOT_TOKEN: "{{`{{ .telegramBotToken }}`}}"
        {{- if has "hr" .Values.enabledModules }}
        # Same value as hr-secrets. HR reads this catalog with it.
        HR_SERVICE_TOKEN: "{{`{{ .hrServiceToken }}`}}"
        {{- end }}
  data:
    - secretKey: denLinkKey
      remoteRef:
        key: modules/learn/den-link
        property: key
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/learn
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: modules/learn/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: modules/learn/s3
        property: secret_key
    - secretKey: keycloakClientSecret
      remoteRef:
        key: infra/keycloak/clients
        property: learn-provisioner
    - secretKey: learnToken
      remoteRef:
        key: modules/learn/service-token
        property: token
    - secretKey: feedbackPepper
      remoteRef:
        key: modules/learn/feedback-pepper
        property: pepper
    - secretKey: telegramBotToken
      remoteRef:
        key: modules/learn/telegram
        property: token
        optional: true
    {{- if has "hr" .Values.enabledModules }}
    - secretKey: hrServiceToken
      remoteRef:
        key: modules/hr/service-token
        property: hr_service_token
    {{- end }}
{{- end }}
