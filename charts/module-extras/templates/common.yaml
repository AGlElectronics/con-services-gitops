{{- $file := printf "files/access-config/%s.toml" .Values.app }}
{{- if or .Values.accessConfig (.Files.Get $file) }}
# The module's access configuration: role -> permission catalog and
# OIDC-group -> role bindings. Read once at start; Argo CD restarts nothing,
# so restart the backend after a change:
#   kubectl -n {{ .Values.namespace }} rollout restart deployment/{{ .Values.app }}-backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app }}-access-config
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  access-config.toml: |-
    {{- .Values.accessConfig | default (.Files.Get $file) | nindent 4 }}
{{- end }}
{{- if .Values.pullSecret }}
---
# Pull secret for private ghcr.io images, from OpenBao kv/infra/ghcr
# (username and a token with only read:packages).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{{`{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}`}}'
  data:
    - secretKey: username
      remoteRef:
        key: infra/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: infra/ghcr
        property: token
{{- end }}
