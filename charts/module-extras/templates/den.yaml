{{- if eq .Values.app "den" }}
# Secrets of Den in conservices-den, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# DEN_CREDENTIAL_KEY is generated once (modules/den/credential-key, property
# key, 48 letters and digits). Den derives each paired module's credential
# from it (HMAC) so it can call GET /api/portal/todos. An upgrade does not
# replace it. Deleting the OpenBao entry creates a new key; portal to-dos
# stay empty until every module is paired again. Modules keep reaching Den
# until then. See docs/secrets.md.
# DEN_SMTP_PASSWORD comes from modules/den/smtp. It is not generated.
# An empty value means modules send mail without a login. The entry must
# exist: External Secrets 2.14 cannot skip a missing key. openbao-seed
# stores an empty password when you skip the prompt. Den does not store
# it in Postgres.
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
#
# den-operator-secrets holds PG_ADMIN_URL, the PostgreSQL SUPERUSER login
# (Den's backups). The most powerful secret of the suite.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: den-secrets
  namespace: conservices-den
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: den-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://den:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/den?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
        KEYCLOAK_CLIENT_SECRET: "{{`{{ .keycloakClientSecret }}`}}"
        OPERATOR_TOKEN: "{{`{{ .operatorToken }}`}}"
        DEN_CREDENTIAL_KEY: "{{`{{ .credentialKey }}`}}"
        # Empty when the OpenBao entry does not exist yet.
        DEN_SMTP_PASSWORD: "{{`{{ .smtpPassword }}`}}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/den
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: modules/den/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: modules/den/s3
        property: secret_key
    - secretKey: keycloakClientSecret
      remoteRef:
        key: infra/keycloak/clients
        property: den-keycloak
    - secretKey: operatorToken
      remoteRef:
        key: modules/den/operator-token
        property: token
    - secretKey: credentialKey
      remoteRef:
        key: modules/den/credential-key
        property: key
    - secretKey: smtpPassword
      remoteRef:
        key: modules/den/smtp
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: den-operator-secrets
  namespace: conservices-den
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: den-operator-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPERATOR_TOKEN: "{{`{{ .operatorToken }}`}}"
        PG_ADMIN_URL: "postgres://postgres:{{`{{ .superuserPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/postgres?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        BACKUP_S3_ACCESS_KEY_ID: "{{`{{ .backupAccessKey }}`}}"
        BACKUP_S3_SECRET_ACCESS_KEY: "{{`{{ .backupSecretKey }}`}}"
        FILES_S3_ACCESS_KEY_ID: "{{`{{ .filesAccessKey }}`}}"
        FILES_S3_SECRET_ACCESS_KEY: "{{`{{ .filesSecretKey }}`}}"
  data:
    - secretKey: operatorToken
      remoteRef:
        key: modules/den/operator-token
        property: token
    - secretKey: superuserPassword
      remoteRef:
        key: infra/postgres/superuser
        property: password
    - secretKey: backupAccessKey
      remoteRef:
        key: modules/den/backup-s3
        property: access_key
    - secretKey: backupSecretKey
      remoteRef:
        key: modules/den/backup-s3
        property: secret_key
    - secretKey: filesAccessKey
      remoteRef:
        key: modules/den/files-s3
        property: access_key
    - secretKey: filesSecretKey
      remoteRef:
        key: modules/den/files-s3
        property: secret_key
{{- end }}
