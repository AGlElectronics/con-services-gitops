{{- if eq .Values.app "tasks" }}
# Secrets of Tasks in conservices-tasks, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasks-secrets
  namespace: conservices-tasks
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: tasks-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://tasks:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/tasks?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        # Encrypts the Den credential the module stores (shared denlink).
        DEN_LINK_ENCRYPTION_KEY: "{{`{{ .denLinkKey }}`}}"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
        TASKS_SERVICE_TOKEN: "{{`{{ .tasksToken }}`}}"
  data:
    - secretKey: denLinkKey
      remoteRef:
        key: modules/tasks/den-link
        property: key
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/tasks
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: modules/tasks/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: modules/tasks/s3
        property: secret_key
    - secretKey: tasksToken
      remoteRef:
        key: modules/tasks/service-token
        property: token
{{- end }}
