{{- if eq .Values.app "finance" }}
# Secrets of Finance in conservices-finance, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "kv"). Nothing secret is in Git.
# Its values are random and created by External Secrets (charts/secret-store).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finance-secrets
  namespace: conservices-finance
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: finance-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://finance:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/finance?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: conservices/postgres/roles/finance
        property: password
{{- end }}
