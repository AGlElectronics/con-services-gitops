{{- if eq .Values.app "desk" }}
# Secrets of Desk in conservices-desk, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
#
# Optional keys (SMTP_PASSWORD, TELEGRAM_BOT_TOKEN) are not included: add a
# data entry and a template line here once the OpenBao entry exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desk-secrets
  namespace: conservices-desk
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: desk-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://desk:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/desk?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        DESK_SECRET_KEY: "{{`{{ .deskSecretKey }}`}}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/desk
        property: password
    - secretKey: deskSecretKey
      remoteRef:
        key: modules/desk/secret-key
        property: key
{{- end }}
