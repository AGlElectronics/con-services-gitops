{{- if eq .Values.app "desk" }}
# Secrets of Desk in conservices-desk, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "conservices", openbao.kvPath). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
#
# Optional keys (SMTP_PASSWORD, TELEGRAM_BOT_TOKEN) are not included: add a
# data entry and a template line here once the OpenBao entry exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desk-secrets
  namespace: conservices-desk
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: desk-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://desk:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/desk?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        # Encrypts the Den credential the module stores (shared denlink).
        DEN_LINK_ENCRYPTION_KEY: "{{`{{ .denLinkKey }}`}}"
        DESK_SECRET_KEY: "{{`{{ .deskSecretKey }}`}}"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
        {{- if has "hr" .Values.enabledModules }}
        # Same value as hr-secrets. HR reads this catalog with it.
        HR_SERVICE_TOKEN: "{{`{{ .hrServiceToken }}`}}"
        {{- end }}
  data:
    - secretKey: denLinkKey
      remoteRef:
        key: modules/desk/den-link
        property: key
    - secretKey: dbPassword
      remoteRef:
        key: infra/postgres/roles/desk
        property: password
    - secretKey: deskSecretKey
      remoteRef:
        key: modules/desk/secret-key
        property: key
    - secretKey: s3AccessKey
      remoteRef:
        key: modules/desk/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: modules/desk/s3
        property: secret_key
    {{- if has "hr" .Values.enabledModules }}
    - secretKey: hrServiceToken
      remoteRef:
        key: modules/hr/service-token
        property: hr_service_token
    {{- end }}
{{- if .Values.google }}
---
# Google Workspace service-account key. Rendered only when
# modules.desk.values.google.enabled is true. The Desk chart then mounts
# Secret desk-google (key service-account.json). Store the JSON at
# modules/desk/google first; an empty file is not a valid key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: desk-google
  namespace: conservices-desk
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: desk-google
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        service-account.json: "{{`{{ .googleSA }}`}}"
  data:
    - secretKey: googleSA
      remoteRef:
        key: modules/desk/google
        property: credentials.json
{{- end }}
{{- end }}
