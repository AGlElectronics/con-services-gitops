{{- if eq .Values.app "rally" }}
# Secrets of Rally in conservices-rally, built by External Secrets from OpenBao
# (ClusterSecretStore "openbao", KV v2 at "kv"). Nothing secret is in Git.
# Random values are created by External Secrets (charts/secret-store); S3
# keys are entered by you (bootstrap/scripts/openbao-seed.sh).
# Inventory: https://aglelectronics.github.io/con-services/operations/secrets/
#
# DATABASE_URL: the role's password comes from the same OpenBao entry that
# CloudNativePG uses for the role (charts/postgres), so they always
# agree. Passwords are hex, so they need no escaping inside the URL.
#
# Optional keys (SMTP_PASSWORD, TELEGRAM_BOT_TOKEN) are not included: add a
# data entry and a template line here once the OpenBao entry exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rally-secrets
  namespace: conservices-rally
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: rally-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://events:{{`{{ .dbPassword }}`}}@conservices-pg-rw.conservices-data.svc.cluster.local:5432/events?sslmode=verify-full&sslrootcert=/etc/conservices-internal-ca/ca.crt"
        S3_ACCESS_KEY_ID: "{{`{{ .s3AccessKey }}`}}"
        S3_SECRET_ACCESS_KEY: "{{`{{ .s3SecretKey }}`}}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: conservices/postgres/roles/events
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: conservices/rally/s3
        property: access_key
    - secretKey: s3SecretKey
      remoteRef:
        key: conservices/rally/s3
        property: secret_key
{{- end }}
