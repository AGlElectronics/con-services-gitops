# Set by the root chart from cluster.yaml.
# den, stash, hr, rally, finance, learn, wiki, desk or tasks.
app: stash
namespace: conservices-stash
# Enabled modules (HR only adds hooks for these).
enabledModules: [stash, hr, rally, finance, learn, wiki, desk, tasks]
# true: create the Secret ghcr-pull from OpenBao conservices/infra/ghcr.
pullSecret: false
# Access configuration (TOML). Empty: files/access-config/<app>.toml.
accessConfig: ""
# HR only: mount the Google Workspace key from OpenBao modules/hr/google-workspace.
# Set from modules.hr.values.googleWorkspace.enabled in cluster.yaml.
googleWorkspace: false
