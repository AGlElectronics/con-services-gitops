{{- /*
The one store every ExternalSecret in this repository uses:

  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao

OpenBao and External Secrets Operator are cluster prerequisites, not part of
this template. ESO logs in to OpenBao with the Kubernetes auth method as its
own service account (role openbao.auth.role, written by the openbao-setup
Job or by bootstrap/scripts/openbao-configure.sh) and reads the KV version 2
engine at openbao.kvPath; it also writes the generated values there
(generated-secrets.yaml). An ExternalSecret's remoteRef.key is the path below that
engine, without "data/": for example "infra/cloudflare".

openbao.server should select only the unsealed leader (with the upstream
chart: the Service "openbao-active"). The plain "openbao" Service also routes
to sealed pods, which makes reads fail at random after a pod restart.
*/ -}}
{{- $o := .Values.openbao }}
{{- $es := .Values.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: {{ $o.server }}
      path: {{ $o.kvPath }}
      version: v2
      {{- with $o.caBundle }}
      {{- if .name }}
      caProvider:
        type: {{ .kind }}
        name: {{ .name }}
        key: {{ .key }}
        namespace: {{ .namespace | default $es.namespace }}
      {{- end }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $o.auth.mountPath }}
          role: {{ $o.auth.role }}
          serviceAccountRef:
            name: {{ $es.serviceAccount }}
            namespace: {{ $es.namespace }}
