{{- /*
The random values of Con Services (database passwords, tokens, client
secrets), created by External Secrets Operator in OpenBao: one PushSecret
per entry, each with its own freshly generated values. updatePolicy
IfNotExists checks every property on its own and writes only missing ones,
so nothing in OpenBao is ever replaced; deletionPolicy None keeps the
values when a PushSecret is removed. To rotate a value, delete it in
OpenBao (docs: operations/secrets).

The ClusterSecretStore's role needs write access for this (policy
conservices-external-secrets: create and update below modules/,
infra/postgres/ and infra/keycloak/ of the mount). External Secrets refuses
to add a property to an entry it did not create (custom_metadata
managed-by). Paths are below openbao.kvPath, for example
"infra/postgres/superuser"; the PushSecret is named after the path without
"modules/" or "infra/" (generated-postgres-superuser).
*/ -}}
{{- if .Values.generated }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: conservices-random
  namespace: {{ .Values.externalSecrets.namespace }}
spec:
  # Letters and digits only: the values go into database URLs unescaped.
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    {{- $keys := list }}
    {{- range .Values.generated }}{{ $keys = concat $keys .properties }}{{ end }}
    {{- range uniq $keys }}
    - {{ . }}
    {{- end }}
{{- range .Values.generated }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: generated-{{ .path | trimPrefix "modules/" | trimPrefix "infra/" | replace "/" "-" }}
  namespace: {{ $.Values.externalSecrets.namespace }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: conservices-random
  data:
    {{- $path := .path }}
    {{- range .properties }}
    - match:
        secretKey: {{ . }}
        remoteRef:
          remoteKey: {{ $path }}
          property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
