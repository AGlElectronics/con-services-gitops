{{- /*
The random values of Con Services (database passwords, tokens, client
secrets, encryption keys), created by External Secrets Operator in OpenBao:
one PushSecret per entry, each with its own freshly generated values.
updatePolicy IfNotExists checks every property on its own and writes only
missing ones, so nothing in OpenBao is ever replaced; deletionPolicy None
keeps the values when a PushSecret is removed. To rotate a value, delete it
in OpenBao (docs: operations/secrets).

The ClusterSecretStore's role needs write access for this (policy
conservices-external-secrets: create and update below modules/,
infra/postgres/ and infra/keycloak/ of the mount). External Secrets refuses
to add a property to an entry it did not create (custom_metadata
managed-by). Paths are below openbao.kvPath, for example
"infra/postgres/superuser"; the PushSecret is named after the path without
"modules/" or "infra/" (generated-postgres-superuser).

Three generators, each a Password resource. conservices-random (48 letters
and digits) for passwords and tokens. conservices-random-credential is the
same alphabet and length, used only for modules/den/credential-key
(DEN_CREDENTIAL_KEY, property key) so that key is not Desk's secret-key.
conservices-random-aes-key (43 letters and digits) is for entries with
generator "aes-key": read as unpadded base64, 43 characters are exactly
32 bytes, the AES-256 key the modules' DEN_LINK_ENCRYPTION_KEY needs.
A PushSecret keeps the value it wrote (updatePolicy IfNotExists). An
upgrade does not generate a new one.
*/ -}}
{{- if .Values.generated }}
{{- $byGen := dict "random" (list) "aes-key" (list) "credential" (list) }}
{{- range .Values.generated }}
{{- $g := .generator | default "random" }}
{{- if not (hasKey $byGen $g) }}{{ fail (printf "generated entry %s: unknown generator %q" .path $g) }}{{ end }}
{{- $_ := set $byGen $g (concat (get $byGen $g) .properties) }}
{{- end }}
{{- with get $byGen "random" }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: conservices-random
  namespace: {{ $.Values.externalSecrets.namespace }}
spec:
  # Letters and digits only: the values go into database URLs unescaped.
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    {{- range uniq . }}
    - {{ . }}
    {{- end }}
{{- end }}
{{- with get $byGen "credential" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: conservices-random-credential
  namespace: {{ $.Values.externalSecrets.namespace }}
spec:
  # Same alphabet as conservices-random. 48 characters is more than the
  # 32 DEN_CREDENTIAL_KEY requires. Its own generator: property "key" here
  # is not the "key" of Desk's secret or of a module's den-link entry.
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    {{- range uniq . }}
    - {{ . }}
    {{- end }}
{{- end }}
{{- with get $byGen "aes-key" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: conservices-random-aes-key
  namespace: {{ $.Values.externalSecrets.namespace }}
spec:
  # 43 letters and digits = 32 bytes as unpadded base64 (about 250 bits of
  # randomness with 10 digits).
  length: 43
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    {{- range uniq . }}
    - {{ . }}
    {{- end }}
{{- end }}
{{- range .Values.generated }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: generated-{{ .path | trimPrefix "modules/" | trimPrefix "infra/" | replace "/" "-" }}
  namespace: {{ $.Values.externalSecrets.namespace }}
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: openbao
  selector:
    generatorRef:
      apiVersion: generators.external-secrets.io/v1alpha1
      kind: Password
      name: {{ index (dict "random" "conservices-random" "credential" "conservices-random-credential" "aes-key" "conservices-random-aes-key") (.generator | default "random") }}
  data:
    {{- $path := .path }}
    {{- range .properties }}
    - match:
        secretKey: {{ . }}
        remoteRef:
          remoteKey: {{ $path }}
          property: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
