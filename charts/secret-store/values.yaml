# Set by the root chart from cluster.yaml (openbao.*, externalSecrets.*).
openbao:
  server: https://openbao-active.openbao.svc:8200
  kvPath: kv
  caBundle:
    kind: ConfigMap
    name: openbao-ca
    key: ca.crt
    namespace: external-secrets
  auth:
    mountPath: kubernetes
    role: external-secrets
externalSecrets:
  namespace: external-secrets
  serviceAccount: external-secrets
