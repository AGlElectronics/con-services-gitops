# Settings of YOUR Con Services cluster. The only file you must edit.
#
# 1. Replace every "change-me" below. `grep -n change-me cluster.yaml`
#    printing nothing means you are done.
# 2. Set enabled: true for the modules you want (section "modules" below).
# 3. Commit and push, then run bootstrap/install-root.sh.
#
# Every other setting has a production default in charts/root/values.yaml.
# To change one, copy its key here (same nesting) and set your value; this
# file wins. The optional section at the end shows the common ones.
# Reference: https://aglelectronics.github.io/con-services/deploy/argocd/#clusteryaml-reference

# --- Required ---------------------------------------------------------------

# Your domain, e.g. example.org. Apps live on <app>.<domain>, Rally on
# events.<domain>, sign-in on auth.<domain>.
domain: change-me

git:
  # HTTPS URL of your copy of this repository,
  # e.g. https://github.com/your-org/con-services-gitops.git
  repoURL: change-me

acme:
  # Let's Encrypt sends certificate expiry warnings to this address.
  email: change-me

s3:
  # Your managed S3-compatible object storage, e.g. https://s3.example-provider.com
  endpoint: change-me
  # The provider's region, e.g. eu-central-1.
  region: change-me
  # Buckets: <bucketPrefix>-conservices-<app>, <bucketPrefix>-pg-backups,
  # <bucketPrefix>-den-backups. Lowercase letters, digits and dashes.
  bucketPrefix: change-me
  # DNS name(s) of the endpoint for the egress network policies,
  # e.g. ["s3.example-provider.com", "*.s3.example-provider.com"].
  fqdns:
    - change-me

den:
  # age public key for Den's encrypted backups: run `age-keygen -o den-backup.key`
  # and copy the "Public key: age1..." line. Keep den-backup.key offline.
  backupAgeRecipients: change-me

# Pick the modules to run (Den is always deployed). Each module waits for Den
# until you pair it from the Den dashboard.
modules:
  stash:   { enabled: false }   # inventory, sign-outs, Lost & Found
  hr:      { enabled: false }   # people, departments, onboarding
  rally:   { enabled: false }   # events and schedule (events.<domain>)
  finance: { enabled: false }   # invoices and money tracking
  learn:   { enabled: false }   # training courses and quizzes
  wiki:    { enabled: false }   # pages in private and team spaces
  desk:    { enabled: false }   # shared support inboxes
  tasks:   { enabled: false }   # projects, task lists and boards

# --- Optional (uncomment to change a default) -------------------------------

# Follow another branch or tag of your copy:
# git:
#   targetRevision: main

# Switch to trusted certificates once the staging certificate works:
# acme:
#   issuer: letsencrypt-prod

# Backups at another region or provider (recommended):
# s3:
#   backup:
#     endpoint: https://s3.other-region.example-provider.com
#     region: other-region
#     fqdns: ["s3.other-region.example-provider.com"]

# Fixed Gateway IPs from your cluster's Cilium LB IPAM pool:
# gateway:
#   public:
#     loadBalancerIP: 192.0.2.240
#   internal:
#     loadBalancerIP: 192.0.2.241

# Longhorn: create longhorn-single and use it for PostgreSQL:
# storage:
#   longhornSingle:
#     enabled: true

# Your cluster's OpenBao and External Secrets Operator (prerequisites) are
# not at the defaults (openbao-active.openbao.svc:8200, CA ConfigMap
# openbao-ca, service account external-secrets/external-secrets):
# openbao:
#   server: https://openbao-active.openbao.svc:8200
#   caBundle:
#     name: openbao-ca
# externalSecrets:
#   namespace: external-secrets
#   serviceAccount: external-secrets

# OpenBao setup: by default Argo CD stops at the Application "openbao-setup"
# until you review it and press Sync; its Job then enables the KV engine and
# writes External Secrets' role (the OpenBao administrator first runs
# bootstrap/scripts/openbao-configure.sh once). External Secrets creates the
# random secrets in any case. The template must not touch OpenBao's
# configuration (the administrator does all of it):
# openbao:
#   setup:
#     enabled: false
