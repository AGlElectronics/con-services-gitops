# Network policies of the Keycloak Operator, on top of the default deny and
# DNS rule of conservices-identity (components/platform-namespaces, wave 0).
# They live here, in the operator's Application (wave 2), because the
# operator must reach the Kubernetes API to become Healthy, and Keycloak
# (charts/keycloak, wave 4) is only applied after that.
# Docs: https://aglelectronics.github.io/con-services/operations/network-policies/
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-operator
  namespace: conservices-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operator
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    # Checks the Keycloak server and its management interface.
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
              app.kubernetes.io/instance: keycloak
      ports:
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 9000 }
---
# Cilium-specific: the Kubernetes API (watches, Deployments, realm import
# Jobs). Without it the operator crash-loops with "timeout getting a
# connection to 10.43.0.1:443".
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keycloak-operator-apiserver
  namespace: conservices-identity
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-operator
  egress:
    - toEntities:
        - kube-apiserver
