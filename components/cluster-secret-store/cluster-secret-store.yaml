# The one store every ExternalSecret in this repository uses:
#
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: openbao
#
# ESO logs in to OpenBao with the Kubernetes auth method as the service
# account external-secrets/external-secrets (role "external-secrets", policy
# "external-secrets-read": read kv/data/*, set up by
# bootstrap/scripts/openbao-init.sh) and reads the KV version 2 engine at
# "kv/". An ExternalSecret's remoteRef.key is the path below kv/, without
# "data/": for example "infra/cloudflare".
#
# OpenBao's certificate is signed by the Con Services internal CA; ESO checks
# it with the trust-manager bundle in its own namespace (the namespace
# external-secrets carries app.kubernetes.io/part-of=conservices).
#
# server: the Service "openbao-active" selects only the unsealed leader.
# The chart's plain "openbao" Service also routes to sealed (not ready)
# pods, which would make reads fail at random after a pod restart.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://openbao-active.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: ConfigMap
        name: conservices-internal-ca
        key: ca.crt
        namespace: external-secrets
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
