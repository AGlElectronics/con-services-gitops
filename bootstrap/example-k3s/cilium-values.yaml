# Cilium 1.20.4 values for the example k3s cluster. They meet the template's
# prerequisites: kube-proxy replacement, Gateway API controller, and L2
# announcements for loadBalancer.ciliumL2 in cluster.yaml.
#
# Install by hand, before Argo CD (there is no pod network yet):
#
#   helm repo add cilium https://helm.cilium.io
#   helm install cilium cilium/cilium --version 1.20.4 -n kube-system \
#     -f bootstrap/example-k3s/cilium-values.yaml
#
# Guide: https://aglelectronics.github.io/con-services/deploy/cluster/#install-cilium

# Replace kube-proxy (k3s runs with disable-kube-proxy). Cilium then needs
# the API server address directly. With three k3s SERVER nodes every node
# runs an API server, so 127.0.0.1 works everywhere and has no single point
# of failure. With worker (agent) nodes, use the server's IP or a virtual IP
# instead: 127.0.0.1:6443 does not exist on agents.
kubeProxyReplacement: true
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443

# Use the per-node pod CIDRs k3s assigns from cluster-cidr 10.42.0.0/16.
ipam:
  mode: kubernetes

# All nodes share one L2 network, so pods are routed natively (no VXLAN
# overhead on top of WireGuard).
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.42.0.0/16
bpf:
  masquerade: true

# WireGuard between nodes for pod traffic and node-to-node traffic.
encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true

# Gateway API controller (needs kubeProxyReplacement and the L7 proxy).
# Envoy runs as its own DaemonSet (the default for new installs).
l7Proxy: true
envoy:
  enabled: true
gatewayAPI:
  enabled: true
  gatewayClass:
    # "auto" creates GatewayClass "cilium" once the Gateway API CRDs exist
    # (k3s installs them right after the pod network is up). The guide runs
    # a second "helm upgrade" to create it during bootstrap.
    create: auto

# LoadBalancer IPs from CiliumLoadBalancerIPPool, announced with ARP (L2).
l2announcements:
  enabled: true
externalIPs:
  enabled: true

# L2 announcements hold one Kubernetes Lease per announced Service; the
# default client limits (10 QPS / 20 burst) are too low for that.
k8sClientRateLimit:
  qps: 50
  burst: 100

operator:
  replicas: 2

# Restart agents automatically when this configuration changes.
rollOutCiliumPods: true

policyEnforcementMode: default

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  tls:
    auto:
      # Generate Hubble certificates inside the cluster with a CronJob, not
      # at render time.
      method: cronJob
