# Longhorn 1.13.0 (chart longhorn/longhorn 1.13.0) for the example k3s
# cluster: the default, replicated StorageClass the template expects.
#
#   kubectl create namespace longhorn-system
#   kubectl label namespace longhorn-system pod-security.kubernetes.io/enforce=privileged
#   helm repo add longhorn https://charts.longhorn.io
#   helm install longhorn longhorn/longhorn --version 1.13.0 -n longhorn-system \
#     -f bootstrap/example-k3s/longhorn-values.yaml
#
# Guide: https://aglelectronics.github.io/con-services/deploy/cluster/#longhorn

# Default StorageClass "longhorn": 3 replicas, one per node, so any single
# node can fail without data loss. With only 2 nodes that can store data,
# set defaultClassReplicaCount (and defaultSettings.defaultReplicaCount) to 2:
# a third replica would have nowhere to go and every volume would stay
# "Degraded". best-effort keeps one replica on the pod's node when possible.
# reclaimPolicy Delete: deleting a PVC deletes its data. For precious volumes,
# patch the PV to Retain.
persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  defaultDataLocality: best-effort
  reclaimPolicy: Delete

defaultSettings:
  defaultReplicaCount: '{"v1":"3","v2":"3"}'
  defaultDataLocality: best-effort
  # Never put two replicas of a volume on the same node.
  replicaSoftAntiAffinity: "false"
  replicaAutoBalance: best-effort
  storageMinimalAvailablePercentage: "15"
  # Let pods of a StatefulSet/Deployment move when their node is down.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  # Drains wait until another healthy replica exists.
  nodeDrainPolicy: block-if-contains-last-replica

# Optional off-cluster backup target, for example:
# defaultBackupStore:
#   backupTarget: s3://longhorn-backups@us-east-1/
#   backupTargetCredentialSecret: longhorn-backup-s3

longhornUI:
  replicas: 2

csi:
  attacherReplicaCount: 3
  provisionerReplicaCount: 3
  resizerReplicaCount: 3
  snapshotterReplicaCount: 3
