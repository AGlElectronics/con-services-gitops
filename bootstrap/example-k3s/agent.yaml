# k3s configuration for a WORKER (agent) node. Only for the "1 server +
# workers" layout; the recommended layout is three servers (server-first.yaml
# and server-join.yaml) and needs no agents. Read "Choosing the node layout"
# in the guide before using this file.
#
#   sudo install -d -m 755 /etc/rancher/k3s
#   sudo install -m 600 agent.yaml /etc/rancher/k3s/config.yaml
#   sudo install -m 600 cluster-token /etc/rancher/k3s/cluster-token
#   curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.37.2+k3s1 sh -s - agent
#
# Guide: https://aglelectronics.github.io/con-services/deploy/cluster/

server: https://10.0.0.11:6443   # the server (node-1)
token-file: /etc/rancher/k3s/cluster-token
